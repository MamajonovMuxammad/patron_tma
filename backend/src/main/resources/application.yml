server:
  port: 8080

spring:
  application:
    name: patron-barbershop-api
  datasource:
    url: jdbc:h2:file:./data/patrondb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

# Business & Telegram Settings (Zero Paid APIs)
patron:
  telegram:
    bot-token: "${TELEGRAM_BOT_TOKEN:8445975545:AAFMyu-P7As3roNMJbYp272i4Qpv6-2d_t4}"
    bot-username: "${TELEGRAM_BOT_USERNAME:patron_99_tashkent_bot}"
    admin-chat-id: "${TELEGRAM_ADMIN_CHAT_ID:0}"
    miniapp-url: "${TELEGRAM_MINIAPP_URL:http://localhost:5173}"
  business:
    name: 'Barbershop "PATRON" (Tashkent)'
    opening-time: "09:00"
    closing-time: "21:00"
    slot-step-minutes: 30
    reminder-window-minutes: 120

logging:
  level:
    com.patron.barbershop: INFO
